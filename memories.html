<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Memories 📖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#ffd6e8,#e0c3fc);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back-btn{
  position:fixed;
  top:20px;
  left:20px;
  background:rgba(255,255,255,.8);
  border:none;
  padding:10px 18px;
  border-radius:30px;
  color:#ff3f8b;
  cursor:pointer;
  z-index:999;
}

.book{
  width:420px;
  height:560px;
  position:relative;
  perspective:2000px;
}

/* PAGE */
.page{
  width:100%;
  height:100%;
  position:absolute;
  top:0;
  left:0;
  background:white;
  border-radius:15px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
  transform-origin:left;
  transition:transform 1s ease;
  overflow:hidden;
  backface-visibility:hidden;
  transform-style:preserve-3d;
}

/* FLIP */
.page.flipped{
  transform:rotateY(-180deg);
  pointer-events:none;
}

.page-content{
  padding:25px;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.page-content h2{
  font-family:'Pacifico',cursive;
  color:#ff3f8b;
}

.mem-img,.mem-video{
  width:90%;
  height:260px;
  object-fit:cover;
  border-radius:15px;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.controls{
  position:fixed;
  bottom:25px;
  display:flex;
  gap:15px;
}

.controls button{
  border:none;
  padding:12px 22px;
  border-radius:30px;
  background:#ff5fa2;
  color:white;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(255,95,162,.4);
}
</style>
</head>

<body>
  <iframe src="music.html" style="display:none;"></iframe>


<button class="back-btn" onclick="goBack()">← Back</button>

<div class="book">

  <!-- Memory 1 -->
  <div class="page">
    <div class="page-content">
      <h2>Memory 1 💕</h2>
      <img src="1.jpg" class="mem-img" onclick="nextPage()">
      <p>Our first cute moment 💖</p>
    </div>
  </div>

  <!-- Memory 2 -->
  <div class="page">
    <div class="page-content">
      <h2>Memory 2 🫶</h2>
      <img src="3.jpg" class="mem-img" onclick="nextPage()">
      <p>Best day ever 💗</p>
    </div>
  </div>

  <!-- Memory 3 -->
  <div class="page">
    <div class="page-content">
      <h2>Memory 3 🌷</h2>
      <img src="7.jpg" class="mem-video" controls onclick="nextPage()"></video>
      <p>Forever vibes 💞</p>
    </div>
  </div>

  <!-- Memory 4 -->
  <div class="page">
    <div class="page-content">
      <h2>Memory 4 💕</h2>
      <img src="4.jpg" class="mem-img" onclick="nextPage()">
  a    <p>Beautifull smilee 💖</p>
    </div>
  </div>

  <!-- Memory 5 -->
  <div class="page">
    <div class="page-content">
      <h2>Memory 5 🫶</h2>
      <img src="5.jpg" class="mem-img" onclick="nextPage()">
      <p> MYY QUEENNNN💗</p>
    </div>
  </div>

  <!-- Memory 6 -->
  <div class="page">
    <div class="page-content">
      <h2>Memory 6 💕</h2>
      <img src="6.jpg" class="mem-img" onclick="nextPage()">
      <p> My shineee 💖</p>
    </div>
  </div>

</div>

<div class="controls">
  <button onclick="prevPage()">⟵ Prev</button>
  <button onclick="nextPage()">Next ⟶</button>
</div>

<script>
let currentPage = 0;
const pages = document.querySelectorAll('.page');

/* AUTO STACKING */
pages.forEach((page, index) => {
  page.style.zIndex = pages.length - index;
});

function nextPage(){
  if(currentPage < pages.length){
    pages[currentPage].classList.add('flipped');
    currentPage++;
  }
}

function prevPage(){
  if(currentPage > 0){
    currentPage--;
    pages[currentPage].classList.remove('flipped');
  }
}

function goBack(){
  window.location.href = "main.html";
}
</script>

</body>
</html>
