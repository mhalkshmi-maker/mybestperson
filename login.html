<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For My Bestie 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #e0c3fc);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* PAGE TRANSITION OVERLAY */
    .page-transition {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .page-transition.active {
      opacity: 1;
      pointer-events: all;
    }

    /* MUSIC MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-content h2 {
      font-family: 'Pacifico', cursive;
      color: #ff5fa2;
      margin-bottom: 10px;
    }

    .modal-content button {
      background: #ff5fa2;
      border: none;
      color: #fff;
      padding: 12px 25px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- PAGE TRANSITION -->
  <div class="page-transition" id="pageTransition"></div>

  <!-- MUSIC MODAL -->
  <div class="modal" id="musicModal">
    <div class="modal-content">
      <h2>Hey Bestie 💕</h2>
      <p>Click to enter the surprise 🎶</p>
      <button onclick="startSite()">Play Music & Open 💖</button>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    function startSite() {
      const transition = document.getElementById('pageTransition');

      // Save permission for music (for main page)
      localStorage.setItem("playMusic", "yes");

      // Start transition
      transition.classList.add('active');

      // Go to main page
      setTimeout(() => {
        window.location.href = "main.html";
      }, 600);
    }
  </script>

</body>
</html>
